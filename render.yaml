# One-click deploy on Render (https://render.com): New > Blueprint > pick this repo.
services:
  - type: web
    name: integrity-radar
    runtime: python
    plan: free
    buildCommand: "true"          # standard library only, nothing to install
    startCommand: python server.py
    healthCheckPath: /healthz
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: IR_READONLY
        value: "1"
      - key: IR_COLLECT_EVERY
        value: "300"
      - key: PYTHON_VERSION
        value: 3.12.7
