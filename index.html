<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Integrity Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#111B2B; --navy2:#1C2A3F; --chalk:#F1F3F6; --sheet:#FFFFFF; --line:#D8DEE6; --line2:#E7EBF0;
  --ink:#111B2B; --ink2:#3F4C5F; --ink3:#64748B;
  --yellow:#F5C400; --red:#D7263D; --pitch:#1E7F5C;
  --pm:#2F5BEA; --book:#E07B00; --kal:#7B4FD6;
  --disp:'Barlow Condensed','Arial Narrow',sans-serif;
  --body:'IBM Plex Sans',system-ui,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html{background:var(--chalk)}
body{margin:0;background:var(--chalk);color:var(--ink);font:14px/1.5 var(--body);font-variant-numeric:tabular-nums}
button,select,textarea,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pm);outline-offset:2px}
a{color:var(--pm)}

/* ---------- top bar ---------- */
.bar{background:var(--navy);color:#fff;display:flex;align-items:center;gap:28px;padding:0 24px;height:58px;position:sticky;top:0;z-index:10}
.mark{font:700 24px/1 var(--disp);letter-spacing:.5px;display:flex;align-items:center;gap:10px;white-space:nowrap}
.mark svg{flex:none}
.bar nav{display:flex;height:100%}
.bar nav button{background:none;border:0;color:#AFC0D6;padding:0 14px;cursor:pointer;height:100%;border-bottom:3px solid transparent;font-weight:500}
.bar nav button.on{color:#fff;border-bottom-color:var(--yellow)}
.bar nav button:hover{color:#fff}
.leagues{display:flex;gap:2px;background:var(--navy2);padding:3px;border-radius:2px}
.leagues button{background:none;border:0;color:#AFC0D6;font:600 17px/1 var(--disp);letter-spacing:.6px;padding:7px 14px;cursor:pointer;border-radius:2px}
.leagues button.on{background:#fff;color:var(--navy)}
.grow{flex:1}

/* ---------- status strip ---------- */
.strip{display:flex;align-items:center;gap:28px;padding:9px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:var(--chalk)}
.stat{display:flex;align-items:baseline;gap:7px;white-space:nowrap}
.stat b{font:700 24px/1 var(--disp)}
.stat span{color:var(--ink2);font-size:13px}
.src{display:flex;gap:16px;flex-wrap:wrap}
.src span{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2);white-space:nowrap}
.src i{width:9px;height:9px;border-radius:50%}
.src b{color:var(--ink);font-weight:600}
.btn{background:var(--sheet);border:1px solid var(--line);border-radius:2px;padding:7px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink3)}
.quiet{color:var(--ink3);font-size:13px}

main{padding:20px 24px 40px}
.view{display:none}.view.on{display:block}

/* ---------- live grid ---------- */
.live{display:grid;grid-template-columns:290px minmax(0,1fr) 340px;gap:16px;align-items:start}
.col-h{font:600 15px/1 var(--body);margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline}
.col-h small{font-weight:400;color:var(--ink3);font-size:12.5px}

/* queue */
.queue{position:sticky;top:78px;max-height:calc(100vh - 152px);overflow:auto;scrollbar-width:thin;scrollbar-color:#B5C0CD transparent}
.queue::-webkit-scrollbar{width:6px}.queue::-webkit-scrollbar-thumb{background:#B5C0CD;border-radius:3px}
.qgroup{margin-bottom:14px}
.qmore{width:100%;background:none;border:1px dashed var(--line);border-radius:4px;padding:8px;color:var(--ink2);cursor:pointer;font-size:12.5px;margin-top:6px}
.qfilter{display:flex;margin-bottom:12px;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--sheet)}
.qfilter button{flex:1;border:0;background:none;padding:6px 2px;font-size:12px;white-space:nowrap;color:var(--ink2);cursor:pointer;border-right:1px solid var(--line)}
.qfilter button:last-child{border-right:0}
.qfilter button.on{background:var(--navy);color:#fff}
.qtools{display:flex;gap:6px;margin-bottom:10px}
.qtools input,.qtools select{flex:1;min-width:0;background:var(--sheet);border:1px solid var(--line);border-radius:4px;padding:5px 8px;font-size:12.5px}
.dec.investigating{color:var(--ink2)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 2px}
.trio div{border:1px solid var(--line2);border-radius:4px;padding:6px 8px}
.trio small{display:block;font-size:11.5px;color:var(--ink3)}
.trio b{font:700 18px/1.1 var(--disp)}
.q-high{color:var(--pitch)}.q-medium{color:#9A7A00}.q-low,.q-none{color:var(--red)}
.case details{margin-top:8px;font-size:13px}.case summary{cursor:pointer;color:var(--ink2);font-weight:600}
.tl li small{color:var(--ink3)}
.src em{font-style:normal;color:var(--red);font-weight:600}
.qgroup h3{font-size:12.5px;font-weight:600;color:var(--ink2);margin:0 0 6px}
.row{display:grid;grid-template-columns:32px 1fr auto;gap:12px;align-items:center;min-height:56px;padding:6px 12px;background:transparent;border:0;border-left:3px solid transparent;border-bottom:1px solid var(--line);width:100%;text-align:left;cursor:pointer}
.row:hover{background:#F2F4F6}
.row.sel{background:#FFF9E6;border-left-color:var(--navy)}
.row .teams{font:700 19px/1.05 var(--disp);letter-spacing:.4px}
.row .teams em{font-style:normal;font-weight:500;color:var(--ink3);margin:0 3px;font-size:15px}
.row .why{font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .when{font-size:12px;color:var(--ink3);text-align:right;white-space:nowrap}
.row .dec{display:block;font-size:11.5px;font-weight:600;margin-top:2px}

/* referee cards */
.rc{width:32px;height:40px;border-radius:3px;display:grid;place-items:center;font:700 17px/1 var(--disp)}
.rc.alert{background:var(--red);color:#fff}
.rc.watch{background:var(--yellow);color:var(--navy)}
.rc.normal{background:transparent;color:var(--ink3);border:1.5px solid var(--line)}
.dec.dismiss{color:var(--pitch)}.dec.monitor{color:#9A7A00}.dec.escalate{color:var(--red)}

/* evidence column */
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:4px}
.scorebug{display:grid;grid-template-columns:1fr auto 1fr;background:var(--navy);color:#fff;border-radius:4px 4px 0 0;overflow:hidden;min-height:96px}
.side{display:flex;align-items:center;gap:14px;padding:12px 20px;position:relative}
.side.home{justify-content:flex-end;text-align:right}
.side::before{content:"";position:absolute;top:0;bottom:0;width:8px;background:var(--tc,#555)}
.side.away::before{left:0}.side.home::before{right:0}
.side img{width:44px;height:44px;object-fit:contain;background:#fff;border-radius:50%;padding:4px}
.side .code{font:700 40px/0.9 var(--disp);letter-spacing:1px}
.side .nm{font-size:12.5px;color:#AFC0D6;margin-top:3px}
.side .ha{font-size:11.5px;color:#7E93AD}
.at{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0 10px;font-size:12px;color:#7E93AD}
.clock{font:600 28px/1 var(--disp);color:var(--yellow);background:#08111E;padding:6px 12px;border-radius:2px;letter-spacing:1px}
.bugmeta{display:flex;justify-content:space-between;gap:12px;padding:7px 20px;background:var(--navy2);color:#C9D6E6;font-size:13px;flex-wrap:wrap}
.bugmeta b{color:#fff;font-weight:600}
.ev-body{padding:12px 20px 14px}

table{width:100%;border-collapse:collapse}
.mtable th{font-size:12.5px;font-weight:500;color:var(--ink3);text-align:left;padding:0 10px 8px 0;border-bottom:1px solid var(--line)}
.mtable td{padding:6px 10px 6px 0;border-bottom:1px solid var(--line2);vertical-align:middle}
.mtable .p{font:700 23px/1 var(--disp)}
.mtable .srcn{display:flex;align-items:center;gap:8px;font-weight:600}
.mtable .srcn i{width:10px;height:10px;border-radius:50%}
.mtable .det{color:var(--ink2);font-size:12.5px}
.up,.down{color:var(--ink);font-weight:600}
.hit{color:var(--pitch);font-weight:600}.miss{color:var(--red);font-weight:600}
.up::before{content:"▲ ";font-size:10px;color:var(--ink3)}.down::before{content:"▼ ";font-size:10px;color:var(--ink3)}
.spread{margin:10px 0 0;font-size:13px;color:var(--ink2)}
.spread b{color:var(--ink)}

.chartwrap{margin-top:12px}
.chart-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:10px;flex-wrap:wrap}
.chart-h h4{margin:0;font-size:14px;font-weight:600}
.seg{display:flex;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.seg button{background:var(--sheet);border:0;padding:4px 11px;cursor:pointer;color:var(--ink2);font-size:12.5px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--navy);color:#fff}
.chart{width:100%;height:auto;display:block;overflow:visible}
.readout{font-size:12.5px;color:var(--ink2);min-height:19px;margin-top:4px}
.caption{font-size:12.5px;color:var(--ink3);margin:8px 0 0;max-width:72ch}

/* case column */
.case{position:sticky;top:78px}
.case .sheet{display:flex;flex-direction:column;max-height:calc(100vh - 152px);overflow:hidden}
.case-scroll{padding:14px 18px 6px;overflow:auto;scrollbar-width:thin}
.case-foot{border-top:1px solid var(--line);padding:10px 18px 12px;background:#FAFBFC}
.case-foot h4{margin:0 0 8px!important}
.verdict{display:flex;gap:14px;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--line2)}
.bigcard{width:52px;height:70px;border-radius:4px;display:grid;place-items:center;font:700 30px/1 var(--disp);transform:rotate(-3deg);flex:none}
.bigcard.alert{background:var(--red);color:#fff}.bigcard.watch{background:var(--yellow);color:var(--navy)}
.bigcard.normal{background:var(--sheet);color:var(--pitch);border:2px solid var(--pitch);transform:none}
.verdict h2{margin:0;font:700 28px/1 var(--disp);letter-spacing:.3px}
.verdict p{margin:4px 0 0;font-size:12.5px;color:var(--ink2)}
@media (prefers-reduced-motion:no-preference){.bigcard.alert,.bigcard.watch{animation:show .35s ease-out}}
@keyframes show{from{transform:translateY(-8px) rotate(-9deg);opacity:0}to{transform:rotate(-3deg);opacity:1}}

.case h4{font-size:13.5px;font-weight:600;margin:12px 0 6px}
.brk{display:flex;flex-direction:column;gap:7px}
.brk .it{display:grid;grid-template-columns:1fr 42px;gap:2px 10px;font-size:13px}
.brk .it .t{font-weight:600}
.brk .it .n{text-align:right;font:600 16px/1.2 var(--disp)}
.brk .it .bar2{grid-column:1/-1;height:5px;background:var(--line2);border-radius:1px;position:relative}
.brk .it .bar2 i{position:absolute;inset:0 auto 0 0;background:var(--navy);border-radius:1px}
.brk .it .s{grid-column:1/-1;color:var(--ink2);font-size:12.5px}
.scale{position:relative;height:30px;margin-top:12px}
.scale .track{position:absolute;top:8px;left:0;right:0;height:6px;background:linear-gradient(90deg,var(--line2) 0 20%,#F8E7A1 20% 45%,#F3B8C0 45%)}
.scale .pin{position:absolute;top:2px;width:3px;height:18px;background:var(--navy)}
.scale .lab{position:absolute;top:18px;font-size:11px;color:var(--ink3);transform:translateX(-50%)}
.info{font-size:12.5px;color:var(--ink3)}
.case ul{margin:0;padding-left:18px;font-size:13px;color:var(--ink2)}
.case ul li{margin-bottom:3px}
.checks{list-style:none;padding:0!important}
.checks label{display:flex;gap:8px;align-items:flex-start;cursor:pointer;color:var(--ink)}
.checks input{margin-top:3px;accent-color:var(--navy)}
.ai{font-size:12px;color:var(--ink3);margin:-4px 0 8px}
.decide{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}
.decide button{height:36px;padding:0 6px;border:1px solid var(--line);background:var(--sheet);border-radius:2px;cursor:pointer;font-weight:600;font-size:13px}
.decide button:hover{border-color:var(--ink3)}
.decide button.on[data-d=dismiss]{background:var(--pitch);border-color:var(--pitch);color:#fff}
.decide button.on[data-d=monitor]{background:var(--yellow);border-color:var(--yellow);color:var(--navy)}
.decide button.on[data-d=escalate],.decide button[data-d=escalate]:hover{background:var(--red);border-color:var(--red);color:#fff}
textarea{width:100%;background:#fff;border:1px solid var(--line);border-radius:4px;padding:8px 10px;min-height:40px;height:40px;resize:vertical;line-height:1.4;margin-top:0;margin-bottom:8px}
.log{list-style:none;padding:0!important;margin-top:8px!important}
.log li{font-size:12.5px;color:var(--ink2);border-left:2px solid var(--line);padding-left:8px;margin-bottom:6px}

.empty{padding:48px 20px;color:var(--ink2);text-align:center}
.err{background:#FBE9EC;border:1px solid #EBB3BC;color:#7D1020;padding:10px 14px;border-radius:2px;margin-bottom:14px}

/* ---------- backtest ---------- */
.bt-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
select.btn{padding-right:28px}
.bt-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
.bt-grid .sheet,.bt-wide{padding:18px 20px}
.bt-wide{margin-top:20px}
.sheet h3{margin:0 0 4px;font-size:15px;font-weight:600}
.sheet .lead{margin:0 0 12px;color:var(--ink2);font-size:13px;max-width:70ch}
.dt th{font-size:12.5px;font-weight:500;color:var(--ink3);text-align:left;padding:6px 10px 6px 0;border-bottom:1px solid var(--line)}
.dt td{padding:8px 10px 8px 0;border-bottom:1px solid var(--line2);font-size:13px}
.dt td.big{font:700 18px/1 var(--disp)}
.fx{font-weight:600}

@media (min-width:1241px){
  #v-live.on{display:flex;flex-direction:column;height:calc(100vh - 58px)}
  #v-live main{flex:1;min-height:0;padding:14px 24px}
  #v-live .live{height:100%;grid-template-rows:minmax(0,1fr);align-items:stretch}
  body:has(#v-live.on){overflow:hidden}
  #v-live .queue,#v-live #evidence{height:100%;max-height:none;overflow:auto;position:static}
  #v-live .case{height:100%;position:static}
  #v-live .case .sheet{max-height:100%;height:100%}
}
@media (max-width:1240px){.live{grid-template-columns:280px minmax(0,1fr)}.case{position:static;grid-column:1/-1}}
@media (max-width:820px){
  .live,.bt-grid{grid-template-columns:1fr}
  .queue{position:static;max-height:none}
  .bar{height:auto;flex-wrap:wrap;gap:10px 18px;padding:10px 16px}
  .strip,main{padding-left:16px;padding-right:16px}
  .side .code{font-size:34px}.side img{display:none}
}
</style>
</head>
<body>
<div class="bar">
  <div class="mark">
    <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9.5" fill="none" stroke="#AFC0D6" stroke-width="1.5"/><circle cx="11" cy="11" r="5" fill="none" stroke="#AFC0D6" stroke-width="1.5"/><path d="M11 11 L19 5" stroke="#F2C200" stroke-width="2" stroke-linecap="round"/><circle cx="11" cy="11" r="1.8" fill="#fff"/></svg>
    Integrity Radar
  </div>
  <nav id="tabs" aria-label="Views">
    <button data-v="live" class="on">Live monitor</button>
    <button data-v="bt">Historical analysis</button>
  </nav>
  <div class="grow"></div>
  <div class="leagues" id="leagues" aria-label="League">
    <button data-l="nba" class="on">NBA</button><button data-l="nfl">NFL</button><button data-l="nhl">NHL</button>
  </div>
</div>

<!-- ============ LIVE ============ -->
<div class="view on" id="v-live">
  <div class="strip" id="strip"><span class="quiet">Loading markets…</span></div>
  <main>
    <div id="liveErr"></div>
    <div class="live">
      <div class="queue" id="queue"></div>
      <div id="evidence"></div>
      <aside class="case" id="case"></aside>
    </div>
  </main>
</div>

<!-- ============ BACKTEST ============ -->
<div class="view" id="v-bt">
  <main>
    <div class="bt-top">
      <select class="btn" id="btDiv" aria-label="League">
        <option value="E0">Premier League</option><option value="D1">Bundesliga</option>
        <option value="SP1">La Liga</option><option value="I1">Serie A</option><option value="F1">Ligue 1</option>
      </select>
      <select class="btn" id="btSeason" aria-label="Season">
        <option value="2526">2025/26</option><option value="2425">2024/25</option><option value="2324">2023/24</option>
      </select>
      <span class="quiet">Market context: opening vs closing market-average odds from football-data.co.uk. This does not validate the live detector; see Detector evaluation below.</span>
    </div>
    <div id="btBody"></div>
    <div id="evalBody"></div>
  </main>
</div>

<script>
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const pct = x => x == null ? '–' : (x * 100).toFixed(1) + '%';
const ppS = x => x == null ? '–' : (x > 0 ? '+' : x < 0 ? '−' : '') + Math.abs(x).toFixed(1) + 'pp';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = v => v >= 1e6 ? '$' + (v/1e6).toFixed(1) + 'M' : v >= 1e3 ? '$' + Math.round(v/1e3) + 'k' : '$' + Math.round(v);
const dayTime = t => new Date(t).toLocaleString([], {weekday:'short', hour:'2-digit', minute:'2-digit'});
const LEVEL = {alert:'Escalate', watch:'Review', normal:'Clear'};

function countdown(g){
  if (g.state === 'in') return 'Live';
  if (g.state === 'post') return 'Final';
  const m = Math.round((new Date(g.start) - Date.now()) / 60000);
  if (m <= 0) return 'Starting';
  if (m < 60) return `in ${m} min`;
  if (m < 48 * 60) return `in ${Math.round(m / 60)} h`;
  return dayTime(g.start);
}

let state = {league:'nba', data:null, sel:null, range:'7d', qf:'attention', q:'', sort:'urgency', paused:false, drafts:{}};

// ---------- case status ----------
// Statuses come from the server's immutable decision log. Checklist ticks are a local convenience only;
// the first tick on a new case records one "investigate" event. Only dismissed/escalated count as resolved.
const STATUS = {new:'New', investigating:'Investigating', monitoring:'Monitoring', dismissed:'Dismissed', escalated:'Escalated'};
const RESOLVED = new Set(['dismissed', 'escalated']);
const ACTION = {dismiss:'dismissed', monitor:'monitoring', escalate:'escalated', investigate:'investigating'};
const status = g => g.case?.status || 'new';
const flagged = g => g.level !== 'normal';
const LSC = 'ir-checks-v3';
let checks = (() => { try { return JSON.parse(localStorage.getItem(LSC)) || {}; } catch { return {}; } })();
const saveChecks = () => { try { localStorage.setItem(LSC, JSON.stringify(checks)); } catch {} };

// ---------- navigation ----------
$$('#tabs button').forEach(b => b.onclick = () => {
  $$('#tabs button').forEach(x => x.classList.toggle('on', x === b));
  $$('.view').forEach(v => v.classList.toggle('on', v.id === 'v-' + b.dataset.v));
  $('#leagues').style.visibility = b.dataset.v === 'live' ? 'visible' : 'hidden';
  if (b.dataset.v === 'bt' && !btLoaded) loadBacktest();
});
$$('#leagues button').forEach(b => b.onclick = () => {
  $$('#leagues button').forEach(x => x.classList.toggle('on', x === b));
  state.league = b.dataset.l; state.sel = null; loadLive();
});

// ---------- live ----------
const REFRESH_MS = 120000;
let reqId = 0, timer = null;
function schedule(){ clearTimeout(timer); if (!state.paused) timer = setTimeout(() => loadLive(true), REFRESH_MS); }

async function loadLive(silent){
  const my = ++reqId;
  if (!silent) {
    $('#liveErr').innerHTML = '';
    $('#queue').innerHTML = '<div class="quiet">Loading fixtures…</div>';
    $('#evidence').innerHTML = ''; $('#case').innerHTML = '';
  }
  const note = $('#rvNote'); if (note && state.sel) state.drafts[state.sel] = note.value;
  try {
    const r = await fetch('/api/live?league=' + state.league);
    const d = await r.json();
    if (my !== reqId) return;
    if (d.error) throw new Error(d.error);
    $('#liveErr').innerHTML = '';
    state.data = d;
    renderStrip(); renderQueue();
    const keep = state.sel && d.games.find(g => g.id === state.sel);
    const first = d.games.find(g => g.state === 'pre') || d.games[0];
    if (keep) select(keep.id); else if (first) select(first.id);
    else $('#evidence').innerHTML = `<div class="sheet empty">${d.sources.espn.ok ? 'No fixtures scheduled in this league today or tomorrow. Try another league.' : 'The fixture source (ESPN) is unavailable right now, so fixtures can’t be listed.'}</div>`;
  } catch (e) {
    if (my !== reqId) return;
    $('#liveErr').innerHTML = `<div class="err">Live data didn't load (${esc(e.message)}). Check that <b>python server.py</b> is running, then press Refresh.</div>`;
    if (!silent) $('#queue').innerHTML = '';
  }
  schedule();
}

function renderStrip(){
  const d = state.data, c = d.coverage, g = d.games, S = d.sources || {};
  const open = g.filter(x => flagged(x) && !RESOLVED.has(status(x))).length;
  const n = c.fixtures;
  const src = (k, col, label, cov) => {
    const s = S[k] || {ok:true};
    return `<span title="${esc(s.error || 'OK')}"><i style="background:var(--${col})"></i>${label} ${s.ok ? `<b>${cov}/${n}</b>` : '<em>unavailable</em>'}${s.partial ? ' <em>partial</em>' : ''}</span>`;
  };
  $('#strip').innerHTML = `
    <div class="stat"><b>${n}</b><span>fixtures</span></div>
    <div class="stat"><b style="color:${open ? '#9A7A00' : 'var(--pitch)'}">${open}</b><span>need attention</span></div>
    <div class="stat"><b style="color:${g.some(x => x.level === 'alert') ? 'var(--red)' : 'var(--ink)'}">${g.filter(x => x.level === 'alert').length}</b><span>to escalate</span></div>
    <div class="src">${src('polymarket', 'pm', 'Polymarket', c.polymarket)}${src('espn', 'book', 'DraftKings', c.book)}${src('kalshi', 'kal', 'Kalshi', c.kalshi)}</div>
    <div class="grow"></div>
    <span class="quiet" title="Each source was fetched at this time">Updated ${new Date(d.generated).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})} · ${state.paused ? 'auto-refresh paused' : 'auto-refresh every 2 min'}</span>
    <button class="btn" id="pause">${state.paused ? 'Resume' : 'Pause'}</button>
    <button class="btn" id="refresh">Refresh</button>
    <button class="btn" id="export">Export decisions</button>`;
  $('#refresh').onclick = () => loadLive(true);
  $('#pause').onclick = () => { state.paused = !state.paused; renderStrip(); schedule(); };
  $('#export').onclick = () => { location.href = '/api/decisions.csv'; };
}

const LABELS = {divergence:'Markets disagree', book_move:'Bookmaker line moved', pm_move:'Polymarket moved',
  pm_jump:'Sharp jump', unconfirmed:'Bookmaker didn’t follow', kalshi_gap:'Kalshi disagrees', thin:'Thin market',
  suppressed:'Gap ignored'};
const signals = g => g.reasons.filter(r => 'pts' in r).sort((a, b) => b.pts - a.pts);
const primary = g => signals(g)[0];

const FILTERS = {
  attention:['Needs attention', x => flagged(x) && ['new', 'investigating'].includes(status(x))],
  monitoring:['Monitoring', x => status(x) === 'monitoring'],
  resolved:['Resolved', x => RESOLVED.has(status(x))],
  all:['All', () => true]};
const SORTS = {
  urgency:(a, b) => b.score - a.score || new Date(a.start) - new Date(b.start),
  kickoff:(a, b) => new Date(a.start) - new Date(b.start),
  movement:(a, b) => (b.pm?.maxJumpAt || 0) - (a.pm?.maxJumpAt || 0)};

function renderQueue(){
  const term = state.q.trim().toLowerCase();
  const match = x => !term || [x.home.displayName, x.away.displayName, code(x.home, x.league), code(x.away, x.league)].join(' ').toLowerCase().includes(term);
  const g = state.data.games.filter(FILTERS[state.qf][1]).filter(match).sort(SORTS[state.sort]);
  const pre = g.filter(x => x.state === 'pre'), other = g.filter(x => x.state !== 'pre');
  const isQuiet = x => x.score === 0 && x.id !== state.sel && state.qf === 'all' && !term;
  const quiet = pre.filter(isQuiet), shown = state.showQuiet ? pre : pre.filter(x => !isQuiet(x));
  const row = x => {
    const st = status(x), p = primary(x);
    return `<button class="row ${state.sel === x.id ? 'sel' : ''}" data-id="${x.id}" aria-label="${esc(x.away.displayName)} at ${esc(x.home.displayName)}, priority ${x.score}">
      <span class="rc ${x.level}">${x.score}</span>
      <span style="min-width:0"><span class="teams">${esc(code(x.away, x.league))}<em>@</em>${esc(code(x.home, x.league))}</span>
        <span class="why" style="display:block">${p ? LABELS[p.code] : 'Nothing unusual'}</span></span>
      <span class="when">${countdown(x)}${st !== 'new' ? `<span class="dec ${{dismissed:'dismiss', monitoring:'monitor', escalated:'escalate'}[st] || st}">${STATUS[st]}</span>` : ''}</span>
    </button>`;
  };
  const all = state.data.games;
  const filt = `<div class="qfilter" role="group" aria-label="Filter queue">${Object.entries(FILTERS).map(([k, [lab, fn]]) =>
    `<button data-f="${k}" class="${state.qf === k ? 'on' : ''}">${lab} ${all.filter(fn).length}</button>`).join('')}</div>
    <div class="qtools"><input id="qsearch" type="search" placeholder="Search team" aria-label="Search team" value="${esc(state.q)}">
      <select id="qsort" aria-label="Sort queue">${[['urgency', 'Most urgent'], ['kickoff', 'Kickoff time'], ['movement', 'Latest movement']].map(([k, l]) =>
        `<option value="${k}" ${state.sort === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div>`;
  const emptyMsg = {attention:'Nothing needs attention right now.', monitoring:'No cases are being monitored.',
    resolved:'No resolved cases in this league yet.', all:'No fixtures scheduled.'}[state.qf];
  $('#queue').innerHTML = filt + (g.length ? '' : `<p class="quiet">${term ? 'No team matches that search.' : emptyMsg}</p>`) +
    (pre.length ? `<div class="qgroup"><h3>Before the start · ${pre.length}</h3>${shown.map(row).join('')}
      ${quiet.length ? `<button class="qmore" id="qmore">${state.showQuiet ? 'Hide' : 'Show'} ${quiet.length} with nothing unusual</button>` : ''}</div>` : '') +
    (other.length ? `<div class="qgroup"><h3>In play or finished · ${other.length}</h3>${state.showLive || other.some(x => x.id === state.sel) ? other.map(row).join('') : ''}
      <button class="qmore" id="qlive">${state.showLive ? 'Hide' : 'Show'} games already started</button></div>` : '');
  $$('.row').forEach(r => r.onclick = () => select(r.dataset.id));
  $('#qmore') && ($('#qmore').onclick = () => { state.showQuiet = !state.showQuiet; renderQueue(); });
  $('#qlive') && ($('#qlive').onclick = () => { state.showLive = !state.showLive; renderQueue(); });
  $$('.qfilter button').forEach(b => b.onclick = () => { state.qf = b.dataset.f; renderQueue(); });
  const qs = $('#qsearch');
  qs.oninput = () => { state.q = qs.value; renderQueue(); const n = $('#qsearch'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); };
  $('#qsort').onchange = e => { state.sort = e.target.value; renderQueue(); };
}

function reasonText(r, g){
  const H = g.home.name, A = g.away.name, side = v => v > 0 ? H : A;
  const ctx = r.eff != null && Math.abs(r.eff - r.pp) >= 1 ? ` (≈${Math.abs(r.eff).toFixed(1)}pp at even odds)` : '';
  switch (r.code) {
    case 'divergence': return `Polymarket rates ${side(r.pp)} ${Math.abs(r.pp).toFixed(1)}pp higher than ${g.book.provider}.`;
    case 'book_move': return `${g.book.provider} moved ${Math.abs(r.pp).toFixed(1)}pp toward ${side(r.pp)} since its line opened${ctx}.`;
    case 'pm_move': return `Polymarket moved ${Math.abs(r.pp).toFixed(1)}pp toward ${side(r.pp)} over ${r.windowH != null ? Math.round(r.windowH) + ' hours' : '24 hours'}${ctx}${r.percentile != null ? `, larger than ${r.percentile}% of recent ${g.league.toUpperCase()} fixtures` : ''}.`;
    case 'pm_jump': return `Polymarket swung ${r.pp.toFixed(1)}pp inside two hours${r.at ? ', ending ' + dayTime(r.at * 1000) : ''}.`;
    case 'unconfirmed': return `Polymarket moved ${Math.abs(r.pp).toFixed(1)}pp while ${g.book.provider} moved ${Math.abs(r.bookPP).toFixed(1)}pp over the same ${Math.round(r.windowH)}h.`;
    case 'kalshi_gap': return `Kalshi is ${Math.abs(r.pp).toFixed(1)}pp ${r.pp > 0 ? 'higher' : 'lower'} on ${H} than Polymarket.`;
    case 'thin': return `Only ${money(r.vol || 0)} traded on Polymarket, so its signals count for less.`;
    case 'suppressed': return `A ${Math.abs(r.pp).toFixed(1)}pp ${LABELS[r.of].toLowerCase()} gap was not scored: Polymarket quote ${r.why === 'stale' ? 'is stale' : 'spread is too wide'}.`;
  }
  return r.code;
}

function select(id){
  const g = state.data?.games.find(x => x.id === id);
  if (!g) return;
  const note = $('#rvNote'); if (note && state.sel && state.sel !== id) state.drafts[state.sel] = note.value;
  state.sel = id;
  $$('.row').forEach(r => r.classList.toggle('sel', r.dataset.id === id));
  renderEvidence(g); renderCase(g);
}

function clock(g){
  if (g.state === 'in') return 'LIVE';
  if (g.state === 'post') return 'FINAL';
  const m = Math.max(0, Math.round((new Date(g.start) - Date.now()) / 60000));
  return m >= 60 ? `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, '0')}m` : `${m}m`;
}
const START = {nba:'tip-off', nhl:'puck drop', nfl:'kickoff'};
// ESPN uses short codes for some teams; show the codes fans and broadcasters use
const CODES = {
  nba:{GS:'GSW', SA:'SAS', NY:'NYK', NO:'NOP', UTAH:'UTA', WSH:'WAS', PHX:'PHX'},
  nhl:{LA:'LAK', NJ:'NJD', TB:'TBL', SJ:'SJS', UTAH:'UTA'},
  nfl:{WSH:'WAS'},
};
const code = (t, lg) => (CODES[lg] || {})[t.abbreviation] || t.abbreviation;

// ----- evidence column -----
function renderEvidence(g){
  const tc = t => t.color ? '#' + t.color : '#555';
  const side = (t, cls, label) => `<div class="side ${cls}" style="--tc:${tc(t)}">
      ${cls === 'away' && t.logo ? `<img src="${esc(t.logo)}" alt="">` : ''}
      <div><div class="code">${esc(code(t, g.league))}</div><div class="nm">${esc(t.displayName)}</div><div class="ha">${label}</div></div>
      ${cls === 'home' && t.logo ? `<img src="${esc(t.logo)}" alt="">` : ''}</div>`;
  const pmNow = g.state !== 'pre' && g.pm?.preMatchClose != null ? g.pm.preMatchClose : g.pm?.homeNow;
  const rows = [];
  if (g.pm) rows.push(['pm', 'Polymarket', pmNow, g.pm.move24 != null ? g.pm.move24 * 100 : null, '24h',
    `${money(g.pm.volume)} traded${g.state !== 'pre' ? ', price at kickoff' : ''}`, g.pm.url]);
  if (g.pm) rows[0][5] += g.pm.stale ? ` · <b>stale</b>, last trade ${fmtT(g.pm.lastTradeAt)}` : g.pm.lastTradeAt ? ` · last trade ${fmtT(g.pm.lastTradeAt)}` : '';
  if (g.pm?.move && !g.pm.move.covered) rows[0][3] = null;
  if (g.book) rows.push(['book', g.book.provider, g.book.homeNow, g.book.homeOpen != null ? (g.book.homeNow - g.book.homeOpen) * 100 : null, 'since open',
    `${esc(g.book.rawHome)} / ${esc(g.book.rawAway)} moneyline, margin removed${g.book.homeOpen == null ? ' · no opening line' : ''} · quote time not published`, null]);
  if (g.kalshi) rows.push(['kal', 'Kalshi', g.kalshi.homeNow, null, '',
    `${Math.round(g.kalshi.bid * 100)}¢ bid, ${Math.round(g.kalshi.ask * 100)}¢ ask${g.kalshi.matchConfidence === 'low' ? ' · match uncertain' : ''}`, g.kalshi.url]);
  const vals = rows.map(r => r[2]).filter(v => v != null);
  const spread = vals.length > 1 ? (Math.max(...vals) - Math.min(...vals)) * 100 : null;
  const MN = {polymarket:'Polymarket', book:'DraftKings', kalshi:'Kalshi'};
  const missing = Object.entries(g.missing || {}).map(([k, why]) => `${MN[k]}: ${why}`);

  $('#evidence').innerHTML = `<div class="sheet">
    <div class="scorebug">${side(g.away, 'away', 'Away')}<div class="at"><span class="clock">${clock(g)}</span><span>${g.state === 'pre' ? 'until ' + START[g.league] : 'at'}</span></div>${side(g.home, 'home', 'Home')}</div>
    <div class="bugmeta"><span>${state.data.league.toUpperCase()} <b>${g.state === 'pre' ? 'Starts ' + dayTime(g.start) : esc(g.statusText || '')}</b></span>
      <span>Probabilities are for <b>${esc(g.home.name)}</b> to win</span></div>
    <div class="ev-body">
      <table class="mtable"><thead><tr><th>Market</th><th>Win probability</th><th>Movement</th><th>Detail</th></tr></thead><tbody>
      ${rows.map(([c, n, v, mv, win, det, url]) => `<tr>
        <td><span class="srcn"><i style="background:var(--${c})"></i>${esc(n)}</span></td>
        <td class="p">${pct(v)}</td>
        <td>${mv == null ? '<span class="quiet">–</span>' : `<span class="${mv > 0.05 ? 'up' : mv < -0.05 ? 'down' : ''}">${ppS(mv)}</span> <span class="quiet">${win}</span>`}</td>
        <td class="det">${det}${url ? ` <a href="${url}" target="_blank" rel="noopener">View market</a>` : ''}</td></tr>`).join('')}
      </tbody></table>
      <p class="spread">${spread != null ? `Gap between markets: <b>${spread.toFixed(1)}pp</b>.` : 'Only one market prices this fixture, so there is nothing to compare yet.'}
        ${missing.length ? `<span class="quiet">${esc(missing.join(' · '))}.</span>` : ''}</p>
      <div class="chartwrap" id="chartwrap"></div>
    </div></div>`;
  renderChart(g);
}

function renderChart(g){
  const wrap = $('#chartwrap');
  if (!g.pm?.history?.length) { wrap.innerHTML = '<p class="quiet">No Polymarket price history for this fixture.</p>'; return; }
  const all = g.pm.history;
  const tEnd = all[all.length - 1][0];
  const span = {'24h':24, '48h':48}[state.range];
  const pts = span ? all.filter(p => p[0] >= tEnd - span * 3600) : all;
  if (pts.length < 2) { wrap.innerHTML = '<p class="quiet">Not enough price history yet.</p>'; return; }
  const W = 760, H = 210, P = {l:40, r:128, t:22, b:24};
  const t0 = pts[0][0], t1 = Math.max(tEnd, t0 + 1);
  const refs = [];
  if (g.book) { if (g.book.homeOpen != null) refs.push({v:g.book.homeOpen, c:'var(--book)', dash:true, t:`${g.book.provider} opening ${pct(g.book.homeOpen)}`});
                refs.push({v:g.book.homeNow, c:'var(--book)', dash:false, t:`${g.book.provider} now ${pct(g.book.homeNow)}`}); }
  if (g.kalshi?.homeNow != null) refs.push({v:g.kalshi.homeNow, c:'var(--kal)', dash:true, t:`Kalshi now ${pct(g.kalshi.homeNow)}`});
  const vals = pts.map(p => p[1]).concat(refs.map(r => r.v));
  let lo = Math.max(0, Math.min(...vals) - .04), hi = Math.min(1, Math.max(...vals) + .04);
  if (hi - lo < .16) { const m = (hi + lo) / 2; lo = Math.max(0, m - .08); hi = Math.min(1, m + .08); }
  const x = t => P.l + (t - t0) / (t1 - t0) * (W - P.l - P.r);
  const y = v => P.t + (1 - (v - lo) / (hi - lo)) * (H - P.t - P.b);
  let svg = '';
  for (let i = 0; i <= 4; i++) {
    const v = lo + (hi - lo) * i / 4;
    svg += `<line x1="${P.l}" x2="${W - P.r}" y1="${y(v)}" y2="${y(v)}" stroke="#E3E8ED"/><text x="${P.l - 8}" y="${y(v) + 4}" text-anchor="end" fill="#77849A" font-size="11">${Math.round(v * 100)}%</text>`;
  }
  const step = (t1 - t0) > 3 * 86400 ? 86400 : 6 * 3600;
  for (let t = Math.ceil(t0 / step) * step; t < t1; t += step) {
    const d = new Date(t * 1000);
    const lab = step === 86400 ? d.toLocaleDateString([], {weekday:'short', day:'numeric'}) : d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    svg += `<text x="${x(t)}" y="${H - 6}" text-anchor="middle" fill="#77849A" font-size="11">${lab}</text>`;
  }
  // suspicious window
  const jr = g.reasons.find(r => r.code === 'pm_jump');
  if (jr?.at && jr.at - 7200 >= t0) {
    const xa = x(jr.at - 7200), xb = x(jr.at);
    const hm = new Date(jr.at * 1000).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    svg += `<rect x="${xa}" y="${P.t}" width="${Math.max(4, xb - xa)}" height="${H - P.t - P.b}" fill="#F5C400" opacity=".16"/>
      <line x1="${xa}" x2="${xa}" y1="${P.t}" y2="${H - P.b}" stroke="#B38F00" stroke-width="1"/>
      <line x1="${xb}" x2="${xb}" y1="${P.t}" y2="${H - P.b}" stroke="#B38F00" stroke-width="1"/>
      <text x="${xb}" y="${P.t - 7}" text-anchor="end" fill="#7A6100" font-size="11.5" font-weight="600">${jr.pp.toFixed(1)}pp in 2h, ending ${hm}</text>`;
  }
  // kickoff
  if (g.kickoff && g.kickoff > t0 && g.kickoff <= t1)
    svg += `<line x1="${x(g.kickoff)}" x2="${x(g.kickoff)}" y1="${P.t}" y2="${H - P.b}" stroke="#0F1B2D" stroke-dasharray="3 3"/><text x="${x(g.kickoff) - 5}" y="${P.t + 11}" text-anchor="end" fill="#0F1B2D" font-size="11">Kickoff</text>`;
  // reference lines with direct labels (nudged apart)
  const labs = refs.map(r => ({...r, ly:y(r.v)})).sort((a, b) => a.ly - b.ly);
  for (let i = 1; i < labs.length; i++) if (labs[i].ly - labs[i - 1].ly < 14) labs[i].ly = labs[i - 1].ly + 14;
  labs.forEach(r => {
    svg += `<line x1="${P.l}" x2="${W - P.r}" y1="${y(r.v)}" y2="${y(r.v)}" stroke="${r.c}" stroke-width="1.5" ${r.dash ? 'stroke-dasharray="6 4"' : ''}/>
      <text x="${W - P.r + 8}" y="${r.ly + 4}" fill="${r.c}" font-size="11.5" font-weight="600">${esc(r.t)}</text>`;
  });
  const path = pts.map((p, i) => (i ? 'L' : 'M') + x(p[0]).toFixed(1) + ' ' + y(p[1]).toFixed(1)).join(' ');
  const last = pts[pts.length - 1];
  svg += `<path d="${path}" fill="none" stroke="var(--pm)" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="${x(last[0])}" cy="${y(last[1])}" r="4" fill="var(--pm)"/>
    <line id="cx" x1="0" x2="0" y1="${P.t}" y2="${H - P.b}" stroke="#46546A" opacity="0"/>
    <circle id="cd" r="4.5" fill="#fff" stroke="var(--pm)" stroke-width="2" opacity="0"/>
    <rect id="hit" x="${P.l}" y="${P.t}" width="${W - P.l - P.r}" height="${H - P.t - P.b}" fill="transparent"/>`;

  wrap.innerHTML = `<div class="chart-h"><h4>Polymarket price for ${esc(g.home.name)}</h4>
      <div class="seg" role="group" aria-label="Time range"><button data-r="24h" class="${state.range === '24h' ? 'on' : ''}">24 hours</button><button data-r="48h" class="${state.range === '48h' ? 'on' : ''}">48 hours</button><button data-r="7d" class="${state.range === '7d' ? 'on' : ''}">7 days</button></div></div>
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Polymarket price history with bookmaker and Kalshi reference lines">${svg}</svg>
    <p class="caption" id="readout">Blue line: Polymarket's price history. Flat lines: the other markets' current prices only, not their history.${jr ? ' Yellow band: the sharpest two-hour move.' : ''} Hover to read a price.</p>`;
  $$('#chartwrap .seg button').forEach(b => b.onclick = () => { state.range = b.dataset.r; renderChart(g); });
  const svgEl = wrap.querySelector('svg'), hit = wrap.querySelector('#hit');
  hit.addEventListener('mousemove', e => {
    const r = svgEl.getBoundingClientRect();
    const sx = (e.clientX - r.left) / r.width * W;
    const t = t0 + (sx - P.l) / (W - P.l - P.r) * (t1 - t0);
    const p = pts.reduce((a, q) => Math.abs(q[0] - t) < Math.abs(a[0] - t) ? q : a);
    const cx = wrap.querySelector('#cx'), cd = wrap.querySelector('#cd');
    cx.setAttribute('x1', x(p[0])); cx.setAttribute('x2', x(p[0])); cx.setAttribute('opacity', '.5');
    cd.setAttribute('cx', x(p[0])); cd.setAttribute('cy', y(p[1])); cd.setAttribute('opacity', '1');
    $('#readout').innerHTML = `<b>${pct(p[1])}</b> on Polymarket at ${dayTime(p[0] * 1000)}`;
  });
  const capText = $('#readout').innerHTML;
  hit.addEventListener('mouseleave', () => { $('#readout').innerHTML = capText; wrap.querySelector('#cx').setAttribute('opacity', '0'); wrap.querySelector('#cd').setAttribute('opacity', '0'); });
}

// ----- case column -----
function caseSummary(g){
  const codes = g.reasons.map(r => r.code);
  const benign = new Set();
  if (codes.some(c => ['book_move', 'pm_move', 'pm_jump'].includes(c))) { benign.add('Injury or lineup news'); benign.add('A late starter confirmation'); }
  if (codes.includes('thin') || (g.liquidityWeight ?? 1) < 0.6) benign.add('A few large orders in a thin market');
  if (codes.some(c => ['divergence', 'kalshi_gap'].includes(c))) { benign.add('A stale quote on one venue'); benign.add('Different user bases pricing the game differently'); }
  if (!benign.size) benign.add('Routine market adjustment');
  const checks = ['Compare team news timestamps with the move'];
  if (g.pm) checks.push('Check Polymarket trades around the jump');
  if (g.book) checks.push('Confirm whether other bookmakers moved too');
  checks.push('Confirm quotes are current on each venue');
  if (g.level === 'alert') checks.push('Cross-check against professional odds feeds before escalating');
  return {benign:[...benign], checks};
}

const fmtT = t => new Date(t * 1000).toLocaleString([], {weekday:'short', hour:'2-digit', minute:'2-digit'});

function timeline(g){
  const ev = [];
  (g.signalHistory || []).forEach(s => ev.push([s.first_seen, `<b>${esc(LABELS[s.code] || s.code)}</b> first seen at ${Math.abs(s.first_pp).toFixed(1)}pp${s.peak_pp > s.first_pp + 0.05 ? `, peaked ${s.peak_pp.toFixed(1)}pp` : ''}`, 'Integrity Radar collector']));
  const j = g.reasons.find(r => r.code === 'pm_jump');
  if (j?.at) ev.push([j.at, `Polymarket swung <b>${j.pp.toFixed(1)}pp</b> in two hours`, `<a href="${g.pm.url}" target="_blank" rel="noopener">Polymarket</a>`]);
  const mv = g.pm?.move;
  if (mv?.from) ev.push([mv.from, `Start of ${Math.round(mv.windowH)}h Polymarket move window`, 'Polymarket price history']);
  ev.push([g.kickoff, `${START[g.league][0].toUpperCase() + START[g.league].slice(1)}`, 'ESPN']);
  (g.case?.events || []).forEach(e => ev.push([e.at, `<b>${STATUS[e.status]}</b>${e.rationale ? ': ' + esc(e.rationale) : ''} <small>(priority ${e.score ?? '–'} at the time)</small>`, 'Analyst']));
  ev.push([null, 'Team news', 'Not connected. Check official team channels and record what you find in the rationale.']);
  return ev.sort((a, b) => (a[0] ?? Infinity) - (b[0] ?? Infinity))
    .map(([t, what, src]) => `<li>${t ? fmtT(t) + ' · ' : '<i>Unverified</i> · '}${what}<br><small>Source: ${src}</small></li>`).join('');
}

function explanation(g){
  const st = status(g), last = (g.case?.events || []).slice(-1)[0];
  if (st === 'dismissed') return last?.rationale ? ['Explained', 'q-high'] : ['Dismissed, no reason', 'q-medium'];
  if (st === 'escalated') return ['Unexplained', 'q-low'];
  return g.level === 'normal' ? ['Not needed', 'q-high'] : ['Pending', 'q-medium'];
}

async function decide(g, action, note){
  const sig = signals(g);
  const snapshot = {league:g.league, fixture:`${g.away.displayName} @ ${g.home.displayName}`, start:g.start,
    score:g.score, level:g.level, signals:sig.map(r => ({...r, text:reasonText(r, g)})),
    evidence:{dataQuality:g.dataQuality, polymarket:g.pm ? {homeNow:g.pm.homeNow, url:g.pm.url, observedAt:g.pm.observedAt, lastTradeAt:g.pm.lastTradeAt} : null,
      book:g.book ? {provider:g.book.provider, homeNow:g.book.homeNow, homeOpen:g.book.homeOpen, rawHome:g.book.rawHome, rawAway:g.book.rawAway} : null,
      kalshi:g.kalshi ? {homeNow:g.kalshi.homeNow, bid:g.kalshi.bid, ask:g.kalshi.ask, url:g.kalshi.url} : null}};
  const r = await fetch('/api/decision', {method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({caseId:g.caseId, action, rationale:note, snapshot})});
  const d = await r.json();
  if (d.error) throw new Error(d.error);
  g.case = {status:d.status, events:d.events};
}

function renderCase(g){
  const ck = checks[g.caseId] || {};
  const sig = signals(g), top = sig.slice(0, 2), rest = sig.slice(2);
  const notes = g.reasons.filter(r => !('pts' in r));
  const s = caseSummary(g), st = status(g), dq = g.dataQuality || {grade:'none', issues:[]};
  const pos = Math.min(g.score, 100), [ex, exCls] = explanation(g);
  const verdictText = g.level === 'alert' ? 'Strong cross-market signals. Review now and escalate if they can’t be explained.'
    : g.level === 'watch' ? 'Prices moved enough to deserve a two-minute look.'
    : 'Prices look consistent across markets. No review needed.';
  const sigItem = r => `<div class="it"><span class="t">${LABELS[r.code]}${r.correlated ? ' <span class="info">(overlaps, half weight)</span>' : ''}</span><span class="n">+${Math.round(r.pts)}</span>
      <span class="bar2"><i style="width:${Math.min(100, r.pts / Math.max(g.score, 1) * 100)}%"></i></span><span class="s">${esc(reasonText(r, g))}</span></div>`;
  const draft = state.drafts[g.id] ?? '';
  $('#case').innerHTML = `<div class="sheet"><div class="case-scroll">
    <div class="verdict"><div class="bigcard ${g.level}" aria-hidden="true">${g.score}</div>
      <div><h2>${LEVEL[g.level]}</h2><p>${verdictText}</p></div></div>
    <div class="trio">
      <div><small>Review priority</small><b>${g.score}</b></div>
      <div title="${esc(dq.issues.join('\n'))}"><small>Data quality</small><b class="q-${dq.grade}">${{high:'High', medium:'Medium', low:'Low', none:'None'}[dq.grade]}</b></div>
      <div><small>Explanation</small><b class="${exCls}">${ex}</b></div></div>
    <p class="info">Priority orders the queue. It is not a probability of wrongdoing.</p>
    <div class="scale" aria-label="Priority ${g.score} out of 100. Review from 20, escalate from 45.">
      <div class="track"></div><div class="pin" style="left:calc(${pos}% - 1px)"></div>
      <span class="lab" style="left:20%">Review 20</span><span class="lab" style="left:45%">Escalate 45</span></div>

    <h4>Why flagged</h4>
    ${top.length ? `<div class="brk">${top.map(sigItem).join('')}</div>` : '<p class="info">No signal crossed its threshold.</p>'}
    ${rest.length ? `<details><summary>${rest.length} more signal${rest.length > 1 ? 's' : ''}</summary><div class="brk" style="margin-top:6px">${rest.map(sigItem).join('')}</div></details>` : ''}
    ${notes.map(r => `<p class="info" style="margin-top:8px">${esc(reasonText(r, g))}</p>`).join('')}
    ${dq.issues.length ? `<details><summary>Data quality notes (${dq.issues.length})</summary><ul style="margin-top:6px">${dq.issues.map(i => `<li>${esc(i)}</li>`).join('')}</ul></details>` : ''}

    ${g.level !== 'normal' || st !== 'new' ? `
    <details ${g.level !== 'normal' ? 'open' : ''}><summary>Evidence timeline</summary><ul class="log tl">${timeline(g)}</ul></details>
    <details><summary>Potential legitimate explanations</summary><ul style="margin-top:6px">${s.benign.map(e => `<li>${esc(e)}</li>`).join('')}</ul></details>
    <h4>Investigation checklist</h4>
    <ul class="checks">${s.checks.map((c, i) => `<li><label><input type="checkbox" data-c="${i}" ${ck[i] ? 'checked' : ''}> ${esc(c)}</label></li>`).join('')}</ul>` : ''}
    </div>
    <div class="case-foot">
      <h4>Analyst decision <span class="info" style="font-weight:400">· ${STATUS[st].toLowerCase()}</span></h4>
      <textarea id="rvNote" placeholder="Why? e.g. starter ruled out at 18:40" aria-label="Decision rationale">${esc(draft)}</textarea>
      <div class="decide">
        <button data-d="dismiss" class="${st === 'dismissed' ? 'on' : ''}">Dismiss</button>
        <button data-d="monitor" class="${st === 'monitoring' ? 'on' : ''}">Monitor</button>
        <button data-d="escalate" class="${st === 'escalated' ? 'on' : ''}">Escalate case</button>
      </div>
      <p class="info" id="decErr" style="margin:6px 0 0"></p>
    </div>
  </div>`;

  $('#rvNote').oninput = e => { state.drafts[g.id] = e.target.value; };
  $$('#case .checks input').forEach(cb => cb.onchange = async () => {
    (checks[g.caseId] ||= {})[cb.dataset.c] = cb.checked; saveChecks();
    if (cb.checked && status(g) === 'new') {
      try { await decide(g, 'investigate', ''); renderQueue(); renderStrip(); renderCase(g); }
      catch (e) { $('#decErr').textContent = 'Couldn’t record: ' + e.message; }
    }
  });
  $$('#case .decide button').forEach(b => b.onclick = async () => {
    const note = $('#rvNote').value.trim();
    try {
      await decide(g, b.dataset.d, note);
      delete state.drafts[g.id];
      renderCase(g); renderQueue(); renderStrip();
    } catch (e) { $('#decErr').textContent = 'Couldn’t record the decision: ' + e.message; }
  });
}

// ---------- backtest ----------
let btLoaded = false;
$('#btDiv').onchange = $('#btSeason').onchange = loadBacktest;
const OUT = ['Home win', 'Draw', 'Away win'];

async function loadEval(){
  try {
    const d = await (await fetch('/api/evaluation')).json();
    const rows = Object.entries(d);
    $('#evalBody').innerHTML = `<div class="sheet bt-wide"><h3>Detector evaluation · live leagues</h3>
      <p class="lead">How the live detector behaves on fixtures it has collected, and what analysts concluded. Dismissed share of decided cases is a rough false-alert rate.</p>
      ${rows.length ? `<table class="dt"><thead><tr><th>League</th><th>Fixtures seen</th><th>Flagged per 100</th><th>Escalate-level per 100</th><th>Monitoring</th><th>Dismissed</th><th>Escalated</th><th>Dismissed share</th></tr></thead><tbody>
      ${rows.map(([lg, v]) => `<tr><td class="fx">${lg.toUpperCase()}</td><td>${v.fixtures}</td><td>${v.flaggedPer100 ?? '–'}</td><td>${v.alertsPer100 ?? '–'}</td>
        <td>${v.outcomes.monitoring || 0}</td><td>${v.outcomes.dismissed || 0}</td><td>${v.outcomes.escalated || 0}</td><td>${v.dismissRate != null ? pct(v.dismissRate) : '–'}</td></tr>`).join('')}</tbody></table>`
      : '<p class="quiet">No collected fixtures yet. Leave the server running; the collector snapshots every league every 5 minutes.</p>'}</div>`;
  } catch { $('#evalBody').innerHTML = ''; }
}

async function loadBacktest(){
  btLoaded = true; loadEval();
  $('#btBody').innerHTML = '<p class="quiet">Loading the season…</p>';
  try {
    const r = await fetch(`/api/history?div=${$('#btDiv').value}&season=${$('#btSeason').value}`);
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    renderBacktest(d);
  } catch (e) { $('#btBody').innerHTML = `<div class="err">The season didn't load (${esc(e.message)}). Try another season or check the server.</div>`; }
}

function renderBacktest(d){
  const top = [...d.matches].sort((a, b) => Math.abs(b.driftPP) - Math.abs(a.driftPP)).slice(0, 15);
  const unusual = d.matches.filter(m => m.z >= 2).length;
  const improve = (1 - d.brierClose / d.brierOpen) * 100;
  $('#btBody').innerHTML = `
    <div class="strip" style="padding:0 0 16px;border-bottom:1px solid var(--line)">
      <div class="stat"><b>${d.n}</b><span>matches</span></div>
      <div class="stat"><b>${d.meanAbsDrift.toFixed(1)}pp</b><span>typical biggest move before kickoff</span></div>
      <div class="stat"><b style="color:#9A7A00">${unusual}</b><span>unusual moves (2+ standard deviations)</span></div>
      <div class="stat"><b style="color:var(--pitch)">${improve.toFixed(1)}%</b><span>more accurate at close than at open</span></div>
    </div>
    <div class="bt-grid">
      <div class="sheet"><h3>How far prices move before kickoff</h3>
        <p class="lead">Most matches barely move. Yellow bars are the unusual tail, where an analyst would look first.</p>${histSVG(d)}</div>
      <div class="sheet"><h3>Does late money know something?</h3>
        <p class="lead">For outcomes the market shortened, compare the opening probability with how often they actually happened.</p>
        <table class="dt"><thead><tr><th>Shortened by</th><th>Matches</th><th>At open</th><th>At close</th><th>Happened</th></tr></thead><tbody>
        ${d.buckets.map(b => `<tr><td>${esc(b.range)}</td><td>${b.n}</td><td>${pct(b.openProb)}</td><td>${pct(b.closeProb)}</td><td class="big">${pct(b.hit)}</td></tr>`).join('')}</tbody></table>
        <p class="lead" style="margin:10px 0 0">When "happened" beats "at open", the late money carried real information. That's why an unexplained move is worth a review. Small groups are noisy.</p></div>
    </div>
    <div class="sheet bt-wide"><h3>Biggest moves · ${esc(d.name)} ${d.season.slice(0, 2)}/${d.season.slice(2)}</h3>
      <p class="lead">Best-vs-average shows how far the best bookmaker price sat above the average at close. A big number means bookmakers disagreed.</p>
      <table class="dt"><thead><tr><th></th><th>Date</th><th>Fixture</th><th>Moved toward</th><th>Open → close</th><th>Move</th><th>Best vs average</th><th>Result</th></tr></thead><tbody>
      ${top.map(m => { const k = m.driftOutcome, won = m.result === k, lvl = m.z >= 3 ? 'alert' : m.z >= 2 ? 'watch' : 'normal';
        return `<tr><td><span class="rc ${lvl}" style="width:20px;height:26px;font-size:12px" title="z = ${m.z.toFixed(1)}">${m.z.toFixed(0)}</span></td>
          <td>${esc(m.date)}</td><td class="fx">${esc(m.home)} v ${esc(m.away)}</td><td>${OUT[k]}</td>
          <td>${pct(m.open[k])} → ${pct(m.close[k])}</td><td class="big ${m.driftPP > 0 ? 'up' : 'down'}">${ppS(m.driftPP)}</td>
          <td>${m.dispersion != null ? m.dispersion.toFixed(1) + '%' : '–'}</td>
          <td>${esc(m.score)} ${m.driftPP > 0 ? (won ? '<span class="hit">happened</span>' : '<span class="miss">didn’t</span>') : ''}</td></tr>`; }).join('')}
      </tbody></table>
      <p class="lead" style="margin:10px 0 0">The cards show how unusual each move was, in standard deviations: yellow from 2, red from 3.</p></div>`;
}

function histSVG(d){
  const W = 520, H = 190, P = {l:34, r:16, t:12, b:26};
  const bins = new Array(16).fill(0);
  d.matches.forEach(m => { bins[Math.min(15, Math.floor(Math.abs(m.driftPP)))]++; });
  const mx = Math.max(...bins), bw = (W - P.l - P.r) / bins.length, thr = d.meanAbsDrift + 2 * d.sdDrift;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Histogram of pre-match price moves">
    <line x1="${P.l}" x2="${W - P.r}" y1="${H - P.b}" y2="${H - P.b}" stroke="#C9D1D9"/>
    ${bins.map((c, i) => { const h = c / mx * (H - P.t - P.b);
      return `<rect x="${P.l + i * bw + 1}" y="${H - P.b - h}" width="${bw - 2}" height="${h}" fill="${i + 1 > thr ? '#F2C200' : '#0F1B2D'}"><title>${i}–${i + 1}pp: ${c} matches</title></rect>`; }).join('')}
    ${[0, 4, 8, 12, 16].map(v => `<text x="${P.l + v * bw}" y="${H - 8}" fill="#77849A" font-size="11" text-anchor="${v === 16 ? 'end' : 'middle'}">${v}${v === 16 ? '+' : ''}pp</text>`).join('')}
    <text x="${P.l - 6}" y="${P.t + 8}" fill="#77849A" font-size="11" text-anchor="end">${mx}</text></svg>`;
}

loadLive();
</script>
